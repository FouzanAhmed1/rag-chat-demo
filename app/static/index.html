<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rag-chat-demo</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 0; background: #0f1115; color: #e8eaf0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 20px; border-bottom: 1px solid #2a2e38; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { font-size: 12px; color: #9aa0b0; }
  #status { margin-left: auto; font-size: 12px; color: #9aa0b0; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 12px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #2f6fed; color: #fff; }
  .msg.bot { align-self: flex-start; background: #1b1f29; border: 1px solid #2a2e38; }
  .citations { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .cite { font-size: 12px; color: #9aa0b0; background: #14171d; border: 1px solid #2a2e38; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .cite:hover { border-color: #2f6fed; }
  .cite .excerpt { display: none; margin-top: 6px; color: #c6cbd8; font-style: italic; }
  .cite.open .excerpt { display: block; }
  #composer { border-top: 1px solid #2a2e38; padding: 14px 20px; display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
  #q { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2e38; background: #1b1f29; color: inherit; font-size: 15px; }
  #send { padding: 0 22px; border-radius: 10px; border: none; background: #2f6fed; color: #fff; font-size: 15px; cursor: pointer; }
  #send:disabled { opacity: 0.5; cursor: wait; }
  #toolbar { display: flex; gap: 8px; padding: 10px 20px 0; max-width: 860px; width: 100%; margin: 0 auto; align-items: center; }
  #toolbar label { font-size: 12px; color: #9aa0b0; }
  #toolbar input[type=file] { font-size: 12px; color: #9aa0b0; }
  .typing { color: #9aa0b0; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>rag-chat-demo</h1>
  <span class="sub">ask questions over your documents</span>
  <span id="status">connecting...</span>
</header>
<div id="toolbar">
  <label>Ingest a file (.pdf, .txt, .md):</label>
  <input type="file" id="file" accept=".pdf,.txt,.md">
</div>
<div id="chat"></div>
<form id="composer">
  <input id="q" type="text" placeholder="Ask a question about your documents..." autocomplete="off" autofocus>
  <button id="send" type="submit">Send</button>
</form>
<script src="/app.js"></script>
</body>
</html>
